[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "os-info-hwscan"
version = "0.1.0"
description = "Offline hardware inventory scanner for a bootable Linux USB appliance"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Manuel Gonçalves" }]
dependencies = [
  "jsonschema>=4.23,<5",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
  "types-jsonschema>=4.23,<5",
  "types-openpyxl>=3.1,<4",
]

[project.scripts]
hwscan = "hwscan.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hwscan"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["hwscan"]

